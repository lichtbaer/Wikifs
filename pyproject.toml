[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wikifs"
version = "0.1.0"
description = "Virtual Filesystem over Wikipedia & Wikidata for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "requests",
    "markdownify",
    "click",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "types-requests",
    "httpx",
]
docs = [
    "mkdocs",
    "mkdocs-material",
]

[project.scripts]
wikifs = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wikifs*"]

[tool.setuptools]
py-modules = ["cli", "server"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
